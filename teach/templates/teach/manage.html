{% extends "teach/base.html" %}
{% block title %}Manage your submission{% endblock %}
{% block main %}
<h1>Manage your submission</h1>
<noscript><p class="error">This page needs JavaScript: the manage token is in the link's #fragment and is never sent to the server in the URL.</p></noscript>
<div id="manage" data-sub-id="{{ sub_id }}">
  <div id="manage-status" role="status" aria-live="polite">Loading…</div>
  <div id="manage-body" hidden>
    <dl id="manage-facts"></dl>
    <p><img id="manage-overlay" alt="Overlay of the engine's centerlines (red) and your hand traced SVG (green)" hidden></p>
    <form id="delete-form">
      <fieldset>
        <legend>Delete</legend>
        <p><input id="delete-confirm" type="checkbox" required> <label for="delete-confirm">I understand this deletes my bitmap, SVG and description. Only the number remains, marked deleted.</label></p>
        <button type="submit">Delete my submission</button>
      </fieldset>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('teach.static', filename='teach/manage.js') }}"></script>{% endblock %}
